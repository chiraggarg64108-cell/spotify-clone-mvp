<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Player Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden font-sans select-none">

    <!-- Top Workspace (Sidebar + Main Content) -->
    <div class="flex flex-1 overflow-hidden p-2 gap-2 pb-24">
        
        <!-- Left Sidebar -->
        <aside class="w-64 bg-gray-900 rounded-lg p-6 flex flex-col gap-6 shrink-0">
            <div class="flex items-center gap-2 text-white text-2xl font-bold tracking-tight">
                <i class="fa-brands fa-spotify text-green-500 text-3xl"></i>
                <span>Spotify</span>
            </div>

            <nav class="flex flex-col gap-4">
                <a href="#" class="flex items-center gap-4 text-white font-semibold hover:text-green-500 transition">
                    <i class="fa-solid fa-house text-xl w-6 text-center"></i>
                    <span>Home</span>
                </a>
                <a href="#" class="flex items-center gap-4 text-gray-400 font-semibold hover:text-white transition">
                    <i class="fa-solid fa-magnifying-glass text-xl w-6 text-center"></i>
                    <span>Search</span>
                </a>
                <a href="#" class="flex items-center gap-4 text-gray-400 font-semibold hover:text-white transition">
                    <i class="fa-solid fa-book-open text-xl w-6 text-center"></i>
                    <span>Your Library</span>
                </a>
            </nav>

            <div class="border-t border-gray-800 pt-4 mt-auto">
                <p class="text-xs text-gray-500 uppercase tracking-wider font-bold mb-3">Playlists</p>
                <ul class="space-y-2 text-sm text-gray-400">
                    <li class="hover:text-white cursor-pointer transition">Chill Hits</li>
                    <li class="hover:text-white cursor-pointer transition">Late Night Vibes</li>
                    <li class="hover:text-white cursor-pointer transition">Coding Focus</li>
                </ul>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-gray-900 rounded-lg p-8 overflow-y-auto">
            <!-- Header Greeting -->
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-bold tracking-tight">Good morning</h1>
                <div class="w-9 h-9 rounded-full bg-black flex items-center justify-center text-sm font-bold border border-gray-700">
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <!-- Song List Section -->
            <div class="bg-black/40 rounded-lg p-6 border border-gray-800">
                <div class="grid grid-cols-12 text-xs text-gray-400 uppercase tracking-wider border-b border-gray-800 pb-3 mb-4 px-4">
                    <div class="col-span-1">#</div>
                    <div class="col-span-6">Title</div>
                    <div class="col-span-4">Artist</div>
                    <div class="col-span-1 text-right"><i class="fa-regular fa-clock"></i></div>
                </div>

                <!-- 2 Dummy Songs -->
                <div class="space-y-2">
                    <!-- Song 1 -->
                    <div class="grid grid-cols-12 items-center px-4 py-3 rounded-md hover:bg-gray-800/70 transition group cursor-pointer" onclick="selectSong('Blinding Lights', 'The Weeknd')">
                        <div class="col-span-1 text-gray-400 group-hover:text-green-500 font-medium">1</div>
                        <div class="col-span-6 flex items-center gap-4">
                            <img src="https://placehold.co/48x48/1db954/000000?text=BL" alt="Blinding Lights Cover" class="w-12 h-12 rounded object-cover">
                            <div>
                                <p class="font-semibold text-white group-hover:text-green-400 transition">Blinding Lights</p>
                                <span class="text-xs bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded">E</span>
                            </div>
                        </div>
                        <div class="col-span-4 text-gray-400">The Weeknd</div>
                        <div class="col-span-1 text-right text-gray-400 text-sm">3:20</div>
                    </div>

                    <!-- Song 2 -->
                    <div class="grid grid-cols-12 items-center px-4 py-3 rounded-md hover:bg-gray-800/70 transition group cursor-pointer" onclick="selectSong('Midnight City', 'M83')">
                        <div class="col-span-1 text-gray-400 group-hover:text-green-500 font-medium">2</div>
                        <div class="col-span-6 flex items-center gap-4">
                            <img src="https://placehold.co/48x48/3b82f6/ffffff?text=MC" alt="Midnight City Cover" class="w-12 h-12 rounded object-cover">
                            <div>
                                <p class="font-semibold text-white group-hover:text-green-400 transition">Midnight City</p>
                            </div>
                        </div>
                        <div class="col-span-4 text-gray-400">M83</div>
                        <div class="col-span-1 text-right text-gray-400 text-sm">4:03</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Fixed Bottom Music Player Bar -->
    <footer class="fixed bottom-0 left-0 right-0 h-24 bg-black border-t border-gray-800 px-6 flex items-center justify-between z-50">
        
        <!-- Left: Currently Playing Track Info & Album Cover Placeholder -->
        <div class="flex items-center gap-4 w-1/4">
            <img src="https://placehold.co/56x56/1f2937/10b981?text=Album" alt="Album Cover" class="w-14 h-14 rounded-md object-cover border border-gray-800">
            <div>
                <h4 id="current-title" class="text-sm font-semibold text-white hover:underline cursor-pointer">Blinding Lights</h4>
                <p id="current-artist" class="text-xs text-gray-400 hover:underline cursor-pointer">The Weeknd</p>
            </div>
            <button class="text-gray-400 hover:text-green-500 ml-2 transition">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>

        <!-- Center: Player Controls & Progress Bar -->
        <div class="flex flex-col items-center w-2/4 max-w-xl">
            <div class="flex items-center gap-6 mb-2">
                <button class="text-gray-400 hover:text-white transition" title="Previous">
                    <i class="fa-solid fa-backward-step text-lg"></i>
                </button>
                <button class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition" title="Play">
                    <i class="fa-solid fa-play text-sm ml-0.5"></i>
                </button>
                <button class="w-9 h-9 rounded-full bg-gray-800 text-white flex items-center justify-center hover:bg-gray-700 hover:scale-105 transition" title="Pause">
                    <i class="fa-solid fa-pause text-sm"></i>
                </button>
                <button class="text-gray-400 hover:text-white transition" title="Next">
                    <i class="fa-solid fa-forward-step text-lg"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full flex items-center gap-3 text-xs text-gray-400">
                <span>1:14</span>
                <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden cursor-pointer group">
                    <div class="w-1/3 h-full bg-white group-hover:bg-green-500 rounded-full transition-colors"></div>
                </div>
                <span>3:20</span>
            </div>
        </div>

        <!-- Right: Volume Controls -->
        <div class="flex items-center justify-end gap-3 w-1/4 text-gray-400">
            <i class="fa-solid fa-volume-high text-sm hover:text-white cursor-pointer"></i>
            <div class="w-24 h-1.5 bg-gray-800 rounded-full overflow-hidden cursor-pointer group">
                <div class="w-2/3 h-full bg-white group-hover:bg-green-500 rounded-full"></div>
            </div>
        </div>
    </footer>

    <script>
        function selectSong(title, artist) {
            document.getElementById('current-title').textContent = title;
            document.getElementById('current-artist').textContent = artist;
        }
    </script>
    <!-- Upar aapka UI aur design ka saara code hoga -->
      
      <script>
        fetch('http://localhost:3000/api/songs')
          .then(response => response.json())
          .then(songs => {
            console.log("Server se gaane aa gaye:", songs);
            alert("Backend se " + songs.length + " gaane successfully fetch ho gaye!");
          })
          .catch(error => {
            console.error("Backend se connect nahi ho paya", error);
          });
      </script>
  </body>
</html>
</body>
</html>
